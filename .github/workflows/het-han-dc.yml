name: Tu huy phieu dieu chuyen qua han duyet

# Logic nằm ở api/het-han-dc.js trên Vercel (23/11/2026). App gọi trong mỗi vòng đồng bộ, Vercel Cron gọi mỗi ngày;
# lịch GitHub trễ nhiều giờ nên đây chỉ là đường DỰ PHÒNG.
on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch: {}

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Goi ham tu huy tren Vercel
        run: |
          r=$(curl -sS -m 60 -w ' HTTP%{http_code}' -X POST https://cost-master-sigma.vercel.app/api/het-han-dc)
          echo "$r"
          case "$r" in *HTTP200) ;; *) echo "::error::Goi api/het-han-dc loi: $r"; exit 1;; esac
