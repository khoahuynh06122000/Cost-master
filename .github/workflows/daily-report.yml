name: Canh bao lech cap nhat

on:
  # Lich tu chay da chuyen sang Vercel Cron (api/bot.js?viec=sang, 25/11/2026) vi lich GitHub tre 4-10 tieng.
  workflow_dispatch: {}    # bam chay tay de test

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Kiem tra & canh bao ve Teams
        run: node agent/report.mjs
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
          TEAMS_FLOW_URL: ${{ secrets.TEAMS_FLOW_URL }}
          TEAMS_FLOW_URL_BEP: ${{ secrets.TEAMS_FLOW_URL_BEP }}
          TEAMS_PERSONAL_URL: ${{ secrets.TEAMS_PERSONAL_URL }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TEAMS_THE: ${{ vars.TEAMS_THE }}
          AI_API_KEY: ${{ secrets.AI_API_KEY }}
